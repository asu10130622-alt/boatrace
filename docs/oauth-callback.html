<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>OAuth callback</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 640px; margin: 40px auto; padding: 0 16px; }
  code { background: #eee; padding: 2px 6px; border-radius: 4px; word-break: break-all; }
  .field { margin: 16px 0; }
  label { display: block; font-size: 13px; color: #555; margin-bottom: 4px; }
</style>
</head>
<body>
<h1>OAuth callback</h1>
<p>Threads認可後にこの画面に戻ってきます。下の値をコピーして使ってください。</p>
<div class="field">
  <label>code</label>
  <code id="code">(なし)</code>
</div>
<div class="field">
  <label>error</label>
  <code id="error">(なし)</code>
</div>
<script>
  const params = new URLSearchParams(window.location.search);
  document.getElementById("code").textContent = params.get("code") || "(なし)";
  document.getElementById("error").textContent = params.get("error_description") || params.get("error") || "(なし)";
</script>
</body>
</html>
